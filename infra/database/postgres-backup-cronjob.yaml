apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: database
  labels:
    app: postgres-backup
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - |
              set -eo pipefail
              PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h postgres-db -U "$POSTGRES_USER" "$POSTGRES_DB" | gzip > /backups/backup-$(date +%Y%m%d-%H%M%S).sql.gz
              echo "Backup completed successfully"
            envFrom:
            - secretRef:
                name: postgres-credentials
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
